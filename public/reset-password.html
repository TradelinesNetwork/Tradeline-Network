<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="assets/favicon.ico?v=2">
<meta name="theme-color" content="#263644">
<meta name="description" content="Reset your Tradelines Network account password.">
<meta name="robots" content="noindex,nofollow">
<title>Reset Password | Tradelines Network</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:#0D0F1A;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:40px 36px;max-width:440px;width:100%;backdrop-filter:blur(12px)}
  h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:800;margin-bottom:8px}
  .sub{color:rgba(255,255,255,0.6);font-size:14px;margin-bottom:28px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:rgba(255,255,255,0.85)}
  input{width:100%;padding:12px 14px;border:1.5px solid rgba(255,255,255,0.14);border-radius:10px;font-size:14px;background:rgba(255,255,255,0.04);color:#fff;outline:none;margin-bottom:18px;font-family:inherit}
  input:focus{border-color:#1B4FD8}
  button{width:100%;background:#1B4FD8;color:#fff;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;font-family:'Playfair Display',serif}
  button:hover{background:#1642B8}
  button:disabled{opacity:0.5;cursor:not-allowed}
  .msg{padding:12px 14px;border-radius:8px;font-size:13.5px;margin-bottom:16px}
  .msg.err{background:rgba(230,60,60,0.15);color:#ff9a9a;border:1px solid rgba(230,60,60,0.3)}
  .msg.ok{background:rgba(0,196,140,0.15);color:#7cf0c4;border:1px solid rgba(0,196,140,0.3)}
  .link{display:block;text-align:center;margin-top:20px;color:#F0A500;font-size:13px;text-decoration:none}
  .link:hover{text-decoration:underline}
  .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;font-family:'Playfair Display',serif;font-weight:800;font-size:20px}
  .logo span{color:#F0A500}
</style>
<link rel="stylesheet" href="assets/tls-theme.css?v=4">
</head>
<body>
<div class="card">
  <div class="logo"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1em;height:1em;display:inline-block;vertical-align:-0.125em"><path d="M12 3 5 6v5.5c0 4.4 3 8 7 9.5 4-1.5 7-5.1 7-9.5V6l-7-3Z"/></svg> Tradelines <span>Network</span></div>
  <h1>Set a new password</h1>
  <p class="sub" id="sub">Enter a new password for your account.</p>
  <div id="msg"></div>
  <div id="form">
    <label>New password</label>
    <input type="password" id="p1" placeholder="At least 8 characters" minlength="8" autocomplete="new-password">
    <label>Confirm password</label>
    <input type="password" id="p2" placeholder="Re-enter password" minlength="8" autocomplete="new-password">
    <button id="btn" onclick="doReset()">Update password</button>
  </div>
  <a class="link" href="account.html">Back to sign in</a>
</div>
<script type="module">
import { supabase } from './assets/js/tlm-auth.js';

const msg = document.getElementById('msg');
const form = document.getElementById('form');
const sub = document.getElementById('sub');

function show(kind, text){ msg.innerHTML = `<div class="msg ${kind}">${text}</div>`; }

// Supabase puts the recovery token in the URL hash. The client library reads
// it automatically and fires a PASSWORD_RECOVERY event.
let recoveryReady = false;
supabase.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') recoveryReady = true;
});

// Fallback: if hash contains type=recovery, we're good.
if (window.location.hash.includes('type=recovery')) recoveryReady = true;

setTimeout(() => {
  if (!recoveryReady) {
    form.style.display = 'none';
    sub.textContent = 'This reset link is invalid or expired.';
    show('err', 'Please request a new password reset from the sign-in page.');
  }
}, 1500);

window.doReset = async function(){
  const p1 = document.getElementById('p1').value;
  const p2 = document.getElementById('p2').value;
  if (p1.length < 8) return show('err', 'Password must be at least 8 characters.');
  if (p1 !== p2)    return show('err', 'Passwords do not match.');
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Updating…';
  const { error } = await supabase.auth.updateUser({ password: p1 });
  btn.disabled = false; btn.textContent = 'Update password';
  if (error) return show('err', error.message || 'Could not update password.');
  form.style.display = 'none';
  show('ok', '<svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1em;height:1em;display:inline-block;vertical-align:-0.125em"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.2 11 14.7l4.6-4.9"/></svg> Password updated. Redirecting to your account…');
  setTimeout(() => { window.location.href = 'account.html'; }, 1500);
};
</script>
</body>
</html>
