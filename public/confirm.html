<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="assets/favicon.ico?v=2">
<meta name="theme-color" content="#263644">
<meta name="description" content="Step 4 of 4 — review your tradelines, authorized user details and payment, then place your order.">
<title>Step 4: Confirm Order | Tradelines Network</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/checkout-chrome.css?v=1">
<link rel="stylesheet" href="assets/checkout.css?v=2">
</head>
<body class="co-body">
<div id="coHeader"></div>
<div id="coProgress"></div>

<div class="co-wrap" id="coWrap">
  <div>
    <div class="co-card" id="coMain">
      <div class="co-title"><div class="ico" style="background:rgba(10,143,95,.12)"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1em;height:1em;display:inline-block;vertical-align:-0.125em"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.2 11 14.7l4.6-4.9"/></svg></div>Step 4 — Review &amp; Confirm</div>
      <div class="co-sub">Check everything below. Once you place the order, your payment is verified on-chain and the tradelines are scheduled for posting.</div>
      <div id="coReview"></div>
      <label class="co-check"><input type="checkbox" id="coAgree"><span>I confirm the authorized user details are accurate and I accept the <a href="legal.html" target="_blank">Terms of Service, Refund Policy and KYC/AML disclosure</a>. Tradelines are non-refundable once posted.</span></label>
      <div class="co-err" id="coErr" style="display:none"></div>
      <div class="co-actions">
        <a class="co-btn co-btn-ghost" href="payment.html">← Back to payment</a>
        <button class="co-btn" id="coPlace"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1em;height:1em;display:inline-block;vertical-align:-0.125em"><rect x="4" y="10.5" width="16" height="10.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg> Place Order</button>
      </div>
    </div>

    <div class="co-card" id="coDone" style="display:none;text-align:center">
      <div style="font-size:46px"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1em;height:1em;display:inline-block;vertical-align:-0.125em"><path d="m4 20 5-13 8 8Z"/><path d="M16 4.5v2M19 7h2M18.4 3.6l1.4 1.4"/></svg></div>
      <div class="co-title" style="justify-content:center">Order received</div>
      <div class="co-sub" id="coDoneMsg"></div>
      <div class="co-order-ref" id="coRef"></div>
      <div class="co-actions" style="justify-content:center">
        <a class="co-btn co-btn-ghost" href="marketplace.html">Browse more tradelines</a>
        <a class="co-btn" id="coTrack" href="account.html">Track order status →</a>
      </div>
    </div>
  </div>
  <div class="co-aside" id="coSummary"></div>
</div>

<div id="coFooter"></div>

<script type="module">
import { renderChrome, renderSummary, guardStep, requireAuth, getCart, cartUnits, cartTotal, cartFees, cartSubtotal, getCheckout, clearCheckout, saveCart, escapeHtml, bankEmoji } from "./assets/js/checkout-core.js";
import { authedFetch } from "./assets/js/tlm-auth.js";

renderChrome(4);
if(guardStep(4)){
  const user = await requireAuth('confirm');
  if(user){ renderSummary(); renderReview(); }
}

function renderReview(){
  const co = getCheckout();
  const units = cartUnits();
  const au = co.au || [];
  const p = co.payment || {};
  const pay = p.method === 'card'
    ? `<div class="co-kv"><span>Method</span><strong>Card — ${escapeHtml(p.card?.brand||'')} ••••${escapeHtml(p.card?.last4||'')}</strong></div>
       <div class="co-kv"><span>Cardholder</span><strong>${escapeHtml(p.card?.name||'')}</strong></div>`
    : `<div class="co-kv"><span>Method</span><strong>${escapeHtml(p.crypto||'')} on ${escapeHtml(p.network||'')}</strong></div>
       <div class="co-kv"><span>Transaction hash</span><strong class="co-mono">${escapeHtml(p.txHash||'')}</strong></div>`;

  document.getElementById('coReview').innerHTML = `
    <div class="co-review-block">
      <h3>Tradelines (${units.length} AU spot${units.length>1?'s':''})</h3>
      ${units.map((u,i)=>`<div class="co-kv"><span>${escapeHtml(bankEmoji(u.bank))} ${escapeHtml(u.bank)} #${escapeHtml(String(u.id))} — AU: ${escapeHtml((au[i]?.first||'')+' '+(au[i]?.last||''))}</span><strong>$${Number(u.price||0).toLocaleString()}</strong></div>`).join('')}
    </div>
    <div class="co-review-block">
      <h3>Authorized users</h3>
      ${au.map((a,i)=>`<div class="co-kv"><span>${i+1}. ${escapeHtml(a.first)} ${escapeHtml(a.last)} · ${escapeHtml(a.city)}, ${escapeHtml(a.state)} ${escapeHtml(a.zip)}</span><strong class="co-mono">SSN ••••${escapeHtml(a.ssn)}</strong></div>`).join('')}
      <div class="co-note">Authorized user details are encrypted before storage and only decrypted for posting.</div>
    </div>
    <div class="co-review-block">
      <h3>Payment</h3>
      ${pay}
      <div class="co-kv"><span>Subtotal</span><strong>$${cartSubtotal().toLocaleString()}</strong></div>
      <div class="co-kv"><span>Processing fees</span><strong>$${cartFees().toLocaleString()}</strong></div>
      <div class="co-kv co-kv-total"><span>Total</span><strong>$${cartTotal().toLocaleString()}</strong></div>
    </div>`;
}

function fail(msg){
  const el = document.getElementById('coErr');
  el.style.display=''; el.textContent=''+msg;
  el.scrollIntoView({behavior:'smooth',block:'center'});
}

document.getElementById('coPlace').addEventListener('click', async () => {
  document.getElementById('coErr').style.display='none';
  if(!document.getElementById('coAgree').checked) return fail('Please accept the terms to place your order.');
  const btn = document.getElementById('coPlace');
  btn.disabled = true; btn.textContent = 'Submitting…';

  const co = getCheckout();
  const units = cartUnits();
  const payload = {
    items: units.map((u,i)=>({
      tradelineId: String(u.id),
      snapshot: { name: `${u.bank} #${u.id}`, limit: Number(u.limit)||0, age: String(u.age||''), price: Number(u.price)||0, qty: 1 },
      au: co.au[i],
    })),
    paymentMethod: co.payment?.method || 'crypto',
    subtotal: cartSubtotal(), fees: cartFees(), total: cartTotal(),
  };
  if(payload.paymentMethod === 'card') payload.card = co.payment.card;
  else Object.assign(payload, { crypto: co.payment.crypto, network: co.payment.network, txHash: co.payment.txHash });

  let res, data;
  try {
    res = await authedFetch('/api/public/orders', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload),
    });
    const text = await res.text();
    try { data = JSON.parse(text); } catch { data = null; }
  } catch {
    btn.disabled = false; btn.textContent = 'Place Order';
    return fail('Order service unreachable. Your card was not charged and no crypto was claimed — please check your connection and try again.');
  }
      if(!res.ok || !data?.orderId){
    btn.disabled = false; btn.textContent = 'Place Order';
    return fail(data?.error || `Order could not be placed (status ${res.status}). Nothing was charged — please try again or contact support.`);
  }

  saveCart([]); clearCheckout();
  document.getElementById('coMain').style.display='none';
  document.getElementById('coSummary').style.display='none';
  document.getElementById('coProgress').style.display='none';
  document.getElementById('coWrap').classList.add('co-wrap-single');
  document.getElementById('coDone').style.display='';
  document.getElementById('coDoneMsg').textContent = data.message || 'Your payment is being verified. You can track progress from your dashboard.';
  const track = document.getElementById('coTrack');
  if (track) track.href = 'order.html?id=' + encodeURIComponent(String(data.orderId));
  document.getElementById('coRef').innerHTML = `Order reference<br><strong>${escapeHtml(String(data.orderId))}</strong>`;
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
