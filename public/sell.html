  .has-dropdown{position:relative}

  .dropdown{display:none;position:absolute;top:calc(100% + 8px);left:0;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);min-width:220px;padding:8px;z-index:200}

  .nav-cta{background:var(--gold);color:var(--ink)!important;font-weight:600!important;padding:9px 20px!important;border-radius:8px!important;margin-left:10px}

  .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:6px;margin-left:12px}
  .hamburger span{display:block;width:24px;height:2px;background:var(--white);border-radius:2px}
  .mobile-nav{display:none;position:fixed;inset:0;background:var(--ink);z-index:999;flex-direction:column;padding:80px 32px 40px;overflow-y:auto}

  .page-hero{background:var(--ink);padding:72px 24px 60px;position:relative;overflow:hidden}

  .section-title{font-size:clamp(26px,3.5vw,40px);font-weight:800;color:var(--ink);margin-bottom:16px;letter-spacing:-0.02em}
  .section-sub{font-size:17px;color:var(--ink-light);max-width:560px;line-height:1.7}
  .surface-section{background:var(--surface)}
  .dark-section{background:var(--ink)}
  .dark-section .section-title{color:var(--white)}
  .dark-section .section-sub{color:rgba(255,255,255,0.55)}
  .dark-section .section-tag{color:var(--gold)}

  /* ABOUT */
  .mission-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
  .mission-content{}
  .mission-content p{font-size:16px;color:var(--ink-light);line-height:1.8;margin-bottom:20px}
  .mission-content strong{color:var(--ink)}
  .mission-stats{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:32px}
  .mission-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:center}
  .mission-stat-num{font-family:'Playfair Display', serif;font-size:36px;font-weight:800;color:var(--sky);margin-bottom:4px}
  .mission-stat-label{font-size:13px;color:var(--ink-light)}

  .values-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .value-card{padding:32px;border:1px solid var(--border);border-radius:var(--radius);transition:box-shadow 0.2s}
  .value-card:hover{box-shadow:var(--shadow)}
  .value-icon{font-size:36px;margin-bottom:16px}
  .value-title{font-weight:700;font-size:18px;margin-bottom:10px}
  .value-desc{font-size:14px;color:var(--ink-light);line-height:1.7}

  .team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
  .team-card{text-align:center}
  .team-avatar{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;border:3px solid var(--border)}

  .team-role{font-size:13px;color:rgba(255,255,255,0.45)}

  .timeline{display:flex;flex-direction:column;gap:0;position:relative;max-width:700px;margin:0 auto}
  .timeline::before{content:'';position:absolute;left:20px;top:0;bottom:0;width:2px;background:var(--border)}
  .timeline-item{display:flex;gap:28px;padding:0 0 40px 0;position:relative}
  .timeline-dot{width:42px;height:42px;border-radius:50%;background:var(--sky);color:var(--white);font-family:'Playfair Display', serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1;border:3px solid var(--white);box-shadow:0 0 0 2px var(--sky)}
  .timeline-content{}
  .timeline-year{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--sky);margin-bottom:6px}
  .timeline-title{font-weight:700;font-size:16px;margin-bottom:6px}
  .timeline-desc{font-size:14px;color:var(--ink-light);line-height:1.6}

  /* CONTACT */
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start}
  .contact-info{}
  .contact-info h2{font-size:32px;font-weight:800;margin-bottom:16px}
  .contact-info p{font-size:15px;color:var(--ink-light);line-height:1.7;margin-bottom:32px}
  .contact-channels{display:flex;flex-direction:column;gap:16px}

  .contact-channel:hover{box-shadow:var(--shadow)}
  .contact-channel-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}

  .cc-email{background:rgba(240,165,0,0.1);color:#B87800}
  .cc-chat{background:rgba(0,196,140,0.1);color:var(--mint)}

  .contact-channel-info{font-size:13.5px;color:var(--ink-light)}
  .contact-channel-hours{font-size:12px;color:var(--ink-light);margin-top:4px}

  .contact-form-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px}
  .contact-form-title{font-family:'Playfair Display', serif;font-size:20px;font-weight:800;margin-bottom:20px}
  .form-row{margin-bottom:18px}
  .form-label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:7px}
  .form-input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:9px;font-size:14px;font-family:'Inter', 'Roboto', 'Open Sans', sans-serif;outline:none;transition:border-color 0.15s;background:var(--white)}
  .form-input:focus{border-color:var(--sky)}
  .form-textarea{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:9px;font-size:14px;font-family:'Inter', 'Roboto', 'Open Sans', sans-serif;outline:none;resize:vertical;min-height:120px;background:var(--white)}
  .form-textarea:focus{border-color:var(--sky)}
  .form-select{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:9px;font-size:14px;font-family:'Inter', 'Roboto', 'Open Sans', sans-serif;outline:none;cursor:pointer;background:var(--white)}
  .submit-btn{background:var(--sky);color:var(--white);border:none;padding:14px 28px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;font-family:'Playfair Display', serif;transition:all 0.15s;width:100%}
  .submit-btn:hover{background:#1642B8;transform:translateY(-1px)}

  /* BLOG */
  .blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
  .blog-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:box-shadow 0.2s,transform 0.2s;cursor:pointer}
  .blog-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px)}
  .blog-thumb{height:180px;display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;overflow:hidden}
  .blog-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .blog-thumb.t1{background:var(--sky-pale)}
  .blog-thumb.t2{background:var(--gold-light)}
  .blog-thumb.t3{background:rgba(0,196,140,0.14)}
  .blog-thumb.t4{background:rgba(80,0,160,0.10)}
  .blog-thumb.t5{background:rgba(200,30,30,0.10)}
  .blog-thumb.t6{background:#f0f4ff}
  .blog-read-time{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,0.4);color:var(--white);font-size:11px;padding:3px 9px;border-radius:20px}

  .blog-cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--sky);margin-bottom:10px;display:block}
  .blog-title{font-family:'Playfair Display', serif;font-size:17px;font-weight:700;margin-bottom:10px;color:var(--ink);line-height:1.35}
  .blog-excerpt{font-size:13.5px;color:var(--ink-light);line-height:1.6;margin-bottom:16px}
  .blog-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-light)}

  .sell-hero-inner{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
  .earn-calculator{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:28px}

  .earn-row-label{font-size:13.5px;color:rgba(255,255,255,0.55)}

  .sell-step-icon{font-size:36px;margin-bottom:14px}

  .requirements-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}

  .req-desc{font-size:13.5px;color:var(--ink-light);line-height:1.6}

  .sell-form-sub{font-size:14px;color:var(--ink-light);margin-bottom:28px}
footer{background:#080A14;color:rgba(255,255,255,0.6);padding:70px 24px 32px}
  .footer-inner{max-width:1200px;margin:0 auto}

  .footer-contact strong{color:rgba(255,255,255,0.8)}
  .footer-col h4{font-family:'Playfair Display', serif;font-size:14px;font-weight:700;color:var(--white);margin-bottom:18px}
  .footer-col ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  .footer-col ul li a{font-size:13.5px;color:rgba(255,255,255,0.45);transition:color 0.15s}
  .footer-col ul li a:hover{color:var(--white)}
  .footer-socials{display:flex;gap:12px;margin-top:20px}
  .social-btn{width:36px;height:36px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all 0.15s}.social-btn{color:#fff;text-decoration:none}
  .social-btn:hover{background:var(--sky)}
  .footer-bottom{border-top:1px solid rgba(255,255,255,0.08);padding-top:28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:13px}
  .footer-bottom a{color:rgba(255,255,255,0.45)}
  .footer-bottom a:hover{color:var(--white)}

  @media(max-width:1024px){.mission-grid{grid-template-columns:1fr}.contact-grid{grid-template-columns:1fr}.sell-hero-inner{grid-template-columns:1fr}.team-grid{grid-template-columns:repeat(2,1fr)}.sell-steps-grid{grid-template-columns:repeat(2,1fr)}.footer-top{grid-template-columns:1fr 1fr;gap:28px}}
  @media(max-width:768px){.nav-links{display:none}.hamburger{display:flex}.values-grid{grid-template-columns:1fr}.blog-grid{grid-template-columns:1fr}.requirements-grid{grid-template-columns:1fr}.mission-stats{grid-template-columns:1fr 1fr}.team-grid{grid-template-columns:repeat(2,1fr)}.sell-steps-grid{grid-template-columns:1fr}.sell-visual-grid{grid-template-columns:1fr !important}.impact-grid{grid-template-columns:1fr !important}.footer-top{grid-template-columns:1fr}}

  /* FLOATING SUPPORT WIDGET */
  .support-widget{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:12px;z-index:5000}
  .support-btn{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,0.28);transition:transform 0.15s ease;text-decoration:none;border:2px solid rgba(255,255,255,0.9)}
  .support-btn:hover{transform:scale(1.08)}
  .support-btn svg{width:26px;height:26px}
  .support-btn.whatsapp{background:#25D366}
  .support-btn.telegram{background:#229ED9}
  .support-tooltip{position:absolute;right:64px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.15s}
  .support-btn:hover .support-tooltip{opacity:1}
  @media(max-width:640px){.support-widget{bottom:16px;right:16px;gap:10px}.support-btn{width:46px;height:46px}.support-btn svg{width:22px;height:22px}.support-tooltip{display:none}}
  @media(max-width:480px){.footer-links{grid-template-columns:1fr}.footer-top{grid-template-columns:1fr}}
</style>

async function submitSell(){
  const n=document.getElementById('sfName')?.value.trim();

  const btn=document.querySelector('#sellFormContent .submit-btn');

  try{
    const { supabase } = await import('./assets/js/tlm-auth.js');
    const { data:{ user } } = await supabase.auth.getUser();
    const ageNum = parseFloat((age||'').match(/\d+/)?.[0] || '0');
    const { error } = await supabase.from('seller_applications').insert({
      user_id: user?.id ?? null,
      full_name: n, email: e, phone: p,
      bank_name: 'Multiple / TBD',
      card_age_years: ageNum || null,
      notes: 'Qualifying cards: '+(cards||'—')+'. Late payments (24m): '+(l||'no')+'.',
    });
    if(error) throw error;
    document.getElementById('sellFormContent').style.display='none';
    document.getElementById('sellSuccess').style.display='block';
  }catch(err){
    console.error(err);
    alert('Could not submit application: '+(err.message||'unknown error'));
    if(btn){btn.disabled=false; btn.textContent='Submit Application';}
  }
}
