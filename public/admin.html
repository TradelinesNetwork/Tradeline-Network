<html lang="en">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#263644">
<meta name="robots" content="noindex,nofollow">
<title>Admin Console | Tradelines Network</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:#0D0F1A;color:#fff;min-height:100vh;line-height:1.5}
  a{color:inherit}
  header{padding:16px 24px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:16px;background:#08090F;position:sticky;top:0;z-index:10}
  .logo{font-family:'Playfair Display',serif;font-weight:800;font-size:19px;margin-right:auto}
  .logo span{color:#F0A500}
  .who{font-size:13px;color:rgba(255,255,255,0.6)}
  .who button{margin-left:12px;background:transparent;border:1px solid rgba(255,255,255,0.2);color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer}
  .wrap{max-width:1200px;margin:0 auto;padding:24px}
  .tabs{display:flex;gap:6px;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:24px;overflow-x:auto}
  .tab{padding:10px 18px;background:transparent;border:none;color:rgba(255,255,255,0.6);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tab.active{color:#F0A500;border-bottom-color:#F0A500}
  .panel{display:none}
  .panel.active{display:block}
  .row{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:16px 18px;margin-bottom:10px}
  .row .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .row .id{font-family:monospace;font-size:12px;color:rgba(255,255,255,0.45)}
  .row .meta{font-size:13px;color:rgba(255,255,255,0.7);margin-top:6px}
  .row .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btn{padding:7px 14px;border-radius:6px;font-size:12.5px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
  .btn.ok{background:#00C48C;color:#062018}
  .btn.no{background:rgba(230,60,60,0.9);color:#fff}
  .btn.n{background:rgba(255,255,255,0.1);color:#fff}
  .badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;text-transform:uppercase}
  .b-pending{background:rgba(240,165,0,0.2);color:#F0A500}
  .b-verified{background:rgba(0,196,140,0.2);color:#7cf0c4}
  .b-posted{background:rgba(27,79,216,0.25);color:#8fb0ff}
  .b-rejected{background:rgba(230,60,60,0.2);color:#ff9a9a}
  .b-approved{background:rgba(0,196,140,0.2);color:#7cf0c4}
  .empty{padding:60px 20px;text-align:center;color:rgba(255,255,255,0.5)}
  .loading{padding:40px 20px;text-align:center;color:rgba(255,255,255,0.5)}
  .err{padding:20px;background:rgba(230,60,60,0.15);color:#ff9a9a;border-radius:10px;margin-bottom:16px}
  .items{margin-top:10px;padding-left:14px;border-left:2px solid rgba(255,255,255,0.08);font-size:13px;color:rgba(255,255,255,0.7)}
  .stat{display:inline-block;padding:4px 12px;background:rgba(255,255,255,0.06);border-radius:6px;font-size:12.5px;margin-right:8px;margin-bottom:6px}
  .verify-btn{background:#F0A500;color:#0D0F1A;padding:10px 18px;border-radius:8px;font-weight:700;border:none;cursor:pointer;margin-bottom:16px;font-family:inherit;font-size:13px}
  h2{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:12px}
</style>
<link rel="stylesheet" href="assets/tls-theme.css?v=4">
<link rel="stylesheet" href="assets/theme-financial.css?v=5">
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5QFS2S96"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<header>
  <a href="index.html" class="logo"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1em;height:1em;display:inline-block;vertical-align:-0.125em"><path d="M12 3 5 6v5.5c0 4.4 3 8 7 9.5 4-1.5 7-5.1 7-9.5V6l-7-3Z"/></svg> Tradelines <span>Admin</span></a>
  <div class="who" id="who">Loading…</div>
</header>
<div class="wrap" id="root"><div class="loading">Checking access…</div></div>

<script type="module">
import { supabase, escapeHtml } from './assets/js/tlm-auth.js';

const root = document.getElementById('root');
const who = document.getElementById('who');

function money(n){ return '$'+Number(n||0).toFixed(2); }
function fmt(d){ return d ? new Date(d).toLocaleString() : '—'; }
function badge(status, map){ const [c,l] = map[status] || ['b-pending', status]; return `<span class="badge ${c}">${l}</span>`; }

const O_BADGE = { pending_verification:['b-pending','Pending'], verified:['b-verified','Verified'], posted:['b-posted','Posted'], rejected:['b-rejected','Rejected'], cancelled:['b-rejected','Cancelled'] };
const A_BADGE = { pending:['b-pending','Pending'], approved:['b-approved','Approved'], rejected:['b-rejected','Rejected'] };

async function boot(){
  const { data:{ user } } = await supabase.auth.getUser();
  if(!user){ root.innerHTML = '<div class="err">Please <a href="account.html" style="color:#F0A500">sign in</a> first.</div>'; who.textContent=''; return; }
  const { data: isAdmin, error } = await supabase.rpc('has_role', { _user_id: user.id, _role: 'admin' });
  if(error){ root.innerHTML = '<div class="err">Could not verify admin role. Ensure the admin migration has been applied.<br><br><code style="font-size:12px">'+escapeHtml(error.message)+'</code></div>'; who.textContent=user.email||''; return; }
  if(!isAdmin){ root.innerHTML = '<div class="err"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1em;height:1em;display:inline-block;vertical-align:-0.125em"><rect x="4" y="10.5" width="16" height="10.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg> Access denied. Your account does not have the <strong>admin</strong> role.</div>'; who.innerHTML = escapeHtml(user.email||'')+' <button onclick="signOut()">Sign out</button>'; return; }
  who.innerHTML = escapeHtml(user.email||'')+' · <span style="color:#7cf0c4">admin</span> <button onclick="signOut()">Sign out</button>';
  render();
}
window.signOut = async () => { await supabase.auth.signOut(); location.href='account.html'; };

function render(){
  root.innerHTML = `
    <div class="tabs">
      <button class="tab active" data-t="orders">Orders</button>
      <button class="tab" data-t="brokers">Broker Applications</button>
      <button class="tab" data-t="sellers">Seller Applications</button>
    </div>
    <div class="panel active" id="p-orders"><div class="loading">Loading…</div></div>
    <div class="panel" id="p-brokers"><div class="loading">Loading…</div></div>
    <div class="panel" id="p-sellers"><div class="loading">Loading…</div></div>
  `;
  root.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    root.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x===t));
    root.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id==='p-'+t.dataset.t));
  }));
  loadOrders();
  loadApps('broker_applications', 'p-brokers');
  loadApps('seller_applications', 'p-sellers');
}

async function loadOrders(){
  const el = document.getElementById('p-orders');
  const { data, error } = await supabase.from('orders')
    .select('id, status, status_reason, crypto, network, tx_hash, subtotal, total, created_at, order_items(tradeline_snapshot)')
    .order('created_at', { ascending:false }).limit(200);
  if(error) return (el.innerHTML = `<div class="err">${escapeHtml(error.message)}</div>`);
  const rows = (data||[]).map(o => {
    const items = (o.order_items||[]).map(i => {
      const s = i.tradeline_snapshot||{};
      return `<div>${escapeHtml(s.name||'Tradelines')} · qty ${s.qty||1} · ${money((s.price||0)*(s.qty||1))}</div>`;
    }).join('') || '<div>(no items)</div>';
    return `<div class="row">
      <div class="top">
        <div>
          <div><strong>Order #${o.id.slice(0,8)}</strong> ${badge(o.status,O_BADGE)}</div>
          <div class="id">${o.id}</div>
          <div class="meta">${fmt(o.created_at)} · ${escapeHtml(o.crypto)} ${escapeHtml(o.network)} · ${money(o.total)}</div>
          <div class="meta" style="font-family:monospace;word-break:break-all">tx: ${escapeHtml(o.tx_hash)}</div>
          ${o.status_reason ? `<div class="meta" style="color:#ff9a9a"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1em;height:1em;display:inline-block;vertical-align:-0.125em"><path d="M12 4.5 21 19.5H3Z"/><path d="M12 10v4M12 17h.01"/></svg> ${escapeHtml(o.status_reason)}</div>` : ''}
          <div class="items">${items}</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn ok" onclick="setOrder('${o.id}','verified')">Mark Verified</button>
        <button class="btn ok" onclick="setOrder('${o.id}','posted')">Mark Posted</button>
        <button class="btn no" onclick="rejectOrder('${o.id}')">Reject</button>
      </div>
    </div>`;
  }).join('');
  el.innerHTML = `<h2>Orders (${(data||[]).length})</h2>${rows || '<div class="empty">No orders yet.</div>'}`;
}
window.setOrder = async (id, status) => {
  const { error } = await supabase.from('orders').update({ status, status_reason:null }).eq('id', id);
  if(error) return alert(error.message);
  loadOrders();
};
window.rejectOrder = async (id) => {
  const r = prompt('Reason for rejection:'); if(!r) return;
  const { error } = await supabase.from('orders').update({ status:'rejected', status_reason:r }).eq('id', id);
  if(error) return alert(error.message);
  loadOrders();
};

async function loadApps(table, elId){
  const el = document.getElementById(elId);
  const { data, error } = await supabase.from(table).select('*').order('created_at', { ascending:false }).limit(200);
  if(error) return (el.innerHTML = `<div class="err">${escapeHtml(error.message)}</div>`);
  const rows = (data||[]).map(a => `<div class="row">
    <div class="top"><div>
      <div><strong>${escapeHtml(a.business_name || a.full_name || '—')}</strong> ${badge(a.status, A_BADGE)}</div>
      <div class="meta">${escapeHtml(a.email)} · ${escapeHtml(a.phone||'—')} · ${fmt(a.created_at)}</div>
      ${a.tier ? `<span class="stat">Tier: ${escapeHtml(a.tier)}</span>` : ''}
      ${a.monthly_volume ? `<span class="stat">Volume: ${escapeHtml(a.monthly_volume)}</span>` : ''}
      ${a.bank_name ? `<span class="stat">Bank: ${escapeHtml(a.bank_name)}</span>` : ''}
      ${a.card_age_years ? `<span class="stat">Card age: ${a.card_age_years}y</span>` : ''}
      ${a.notes ? `<div class="meta">${escapeHtml(a.notes)}</div>` : ''}
    </div></div>
    <div class="actions">
      <button class="btn ok" onclick="setApp('${table}','${a.id}','approved')">Approve</button>
      <button class="btn no" onclick="setApp('${table}','${a.id}','rejected')">Reject</button>
    </div>
  </div>`).join('');
  el.innerHTML = `<h2>${table==='broker_applications'?'Broker':'Seller'} Applications (${(data||[]).length})</h2>${rows || '<div class="empty">No applications yet.</div>'}`;
}
window.setApp = async (table, id, status) => {
  const { error } = await supabase.from(table).update({ status, reviewed_at:new Date().toISOString() }).eq('id', id);
  if(error) return alert(error.message);
  loadApps(table, table==='broker_applications'?'p-brokers':'p-sellers');
};

boot();
</script>
</body>
</html>
